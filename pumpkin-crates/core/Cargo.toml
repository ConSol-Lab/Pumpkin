[package]
name = "pumpkin-core"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The core of the Pumpkin constraint programming solver."

[lints]
workspace = true

[dependencies]
pumpkin-checking = { version = "0.5.0", path = "../checking" }
thiserror = "2.0.12"
log = "0.4.30"
enumset = "1.1.13"
fnv = "1.0.7" # We require features which are on the `main` branch of the repository but are not on crates.io
rand = { version = "0.10.1", features = [ "alloc" ] }
downcast-rs = "2.0.2"
drcp-format = { version = "0.3.1", path = "../../drcp-format" }
convert_case = "0.12.0"
itertools = "0.15.0"
bitfield-struct = "0.13.0"
num = "0.4.3"
enum-map = "3.1.0"
clap = { version = "4.5.40", optional = true, features=["derive"] }
indexmap = "2.10.0"
dyn-clone = "1.0.20"
flate2 = { version = "1.1.2" }
bit-set = "0.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# Runtime checks, a debugging tool. They slow the solver down, which it reports when it starts
# solving. `checkers` and `inference-checkers` are implied by the features below; they are not meant
# to be enabled directly.
checkers = []
inference-checkers = ["checkers"]
# Check every inference: eager explanations when they are posted, lazy explanations when conflict
# analysis computes them, and the conflicts that propagators report.
check-inferences = ["inference-checkers"]
# Check only the inferences that conflict analysis uses, eager and lazy alike, as a proof checker
# would. Cannot be combined with `check-inferences`.
check-inferences-proof = ["inference-checkers"]
# Check that a propagator has nothing left to propagate when it reports a fixpoint.
check-retention = ["checkers"]
# Consult every retention checker at each fixpoint rather than only those watching a domain that
# changed. Slower, and independent of which propagators were notified.
check-retention-all = ["check-retention"]
# Check that every solution satisfies the description of every constraint.
check-solutions = ["checkers"]
# Check that every learned nogood follows from the inferences of the proof.
check-deductions = []
debug-checks = []
clap = ["dep:clap"]
